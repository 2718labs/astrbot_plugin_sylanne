[tool.ruff]
target-version = "py311"
line-length = 120
src = [".", "rewrite"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "Embodiment-$version"
version_files = ["metadata.yaml:version"]

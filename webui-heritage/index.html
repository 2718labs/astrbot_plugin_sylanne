<!doctype html>
<html lang="zh" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sylanne · 认知核活体</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23100f12'/%3E%3Cpath d='M16 43c8 7 24 7 32-2-2-8-12-7-18-10-5-2-6-7-1-10 5-4 13-1 18 3' fill='none' stroke='%23b88a9e' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Pre-paint theme/lang bootstrap — MUST run before first paint (FOUC guard).
      // Vue-mounted code runs too late and would flash the wrong theme.
      (function () {
        try {
          // Dark is the signature identity; default to it unless the user has
          // explicitly opted into light (persisted). Not OS-driven.
          var t = localStorage.getItem('sylanne_theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
          var l = localStorage.getItem('sylanne_lang')
          if (l) document.documentElement.setAttribute('data-lang', l)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
